* { box-sizing: border-box; }

const live = list => list.filter(i => REVIEW || !i.draft);

  const root = document.documentElement;
  root.lang = lang; root.dir = u.dir;
  document.title = c.pageTitle;
  document.querySelector('meta[name="description"]').content = c.description;
  $('skip').textContent = u.skip;

  $('top').innerHTML = `<a class="brand" href="#hero">${esc(c.name)}</a>
    <button id="lang" type="button" lang="${lang === 'ar' ? 'en' : 'ar'}">${u.other}</button>

  $('lang').addEventListener('click', () => {
    const next = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('lang', next); } catch (e) {}
    render(next);
  });

  $('review').innerHTML = REVIEW ? `<div class="review"><div class="wrap"><p>${u.review}</p></div></div>` : '';

  const buttons = `${CONTENT.cvFile ? `<a class="btn solid" href="${esc(CONTENT.cvFile)}" download="Mohammed_Salem_Alaidarous_CV.pdf">${u.cv}</a>` : ''}

} catch (e) {}
