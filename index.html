const REVIEW = CONTENT.reviewMode && !location.hostname.endsWith('.github.io');

const $ = id => document.getElementById(id);
const MENU_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';

function setMenu(open) {
  $('site-top').classList.toggle('open', open);
  const btn = $('menu-btn');
  if (btn) btn.setAttribute('aria-expanded', String(open));
}

function render(lang) {
  const c = CONTENT[lang], u = UI[lang];
  const needs = n => (REVIEW && n) ? `<p class="needs"><b>${u.confirm}:</b> ${esc(n)}</p>` : '';
  const li = items => items.map(i => `<li>${esc(i)}</li>`).join('');
  const section = (id, note, body) => {
    $(id).innerHTML = `<div class="wrap"><h2 id="${id}-h">${u[id]}</h2>${note ? `<p class="section-lede">${esc(note)}</p>` : ''}<div class="section-body">${body}</div></div>`;
  };

  const root = document.documentElement;
  root.lang = lang; root.dir = u.dir;
  document.title = c.pageTitle;
  document.querySelector('meta[name="description"]').content = c.description;
  $('skip').textContent = u.skip;

  $('bar').innerHTML = `<a class="brand" href="#intro">${esc(c.name)}</a>
    <nav aria-label="${u.navLabel}"><ul class="nav-list" id="nav-list">${Object.entries(u.nav).map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join('')}</ul></nav>
    <div class="tools">
      <button class="tool" id="lang" type="button" lang="${lang === 'ar' ? 'en' : 'ar'}">${u.other}</button>
      <button class="tool" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav-list">${MENU_ICON}${u.menu}</button>
    </div>`;
  setMenu(false);
  $('menu-btn').addEventListener('click', () => setMenu(!$('site-top').classList.contains('open')));
  $('nav-list').addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    setMenu(false);
    const target = document.querySelector(a.getAttribute('href'));
    if (target) target.focus({ preventScroll: true });
  });
  $('lang').addEventListener('click', () => {
    const next = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('lang', next); } catch (e) {}
    render(next);
    $('lang').focus();
  });

  $('review').innerHTML = REVIEW ? `<div class="review"><div class="wrap"><p>${u.review}</p></div></div>` : '';

  const links = `${CONTENT.cvFile ? `<a class="btn solid" href="${esc(CONTENT.cvFile)}" download="Mohammed_Salem_Alaidarous_CV.pdf">${u.cv}</a>` : ''}

  $('hero').innerHTML = `<div class="hero-text">

      <h1>${esc(c.name)}</h1>
      <p class="title">${esc(c.title)}</p>

      <p class="target"><b>${u.seeking}</b> ${esc(c.target)}</p>

  section('results', u.resultsNote, `<ul class="figures">${c.results.map(r => `

  section('experience', u.experienceNote, `<ol class="timeline">${c.experience.map(e => `

      <p>${esc(p.text)}</p>${needs(p.needs)}</div>${p.photos ? photos : ''}</article>`).join('')}</div>`);

  section('skills', '', `<div class="cards">${c.skills.map(g => `

  section('contact', c.contactNote, `<div class="contact-row"><a class="email" id="email" href="mailto:${esc(CONTENT.email)}" dir="ltr">${esc(CONTENT.email)}</a>
      <button class="btn" id="copy" type="button">${u.copy}</button></div>
    <p class="status" id="status" role="status"></p>
    <div class="actions">${links}</div>`);
  $('copy').addEventListener('click', () => {
    const fail = () => {
      const r = document.createRange(); r.selectNodeContents($('email'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      $('status').textContent = u.copyFail;
    };
    try {
      navigator.clipboard.writeText(CONTENT.email).then(() => { $('status').textContent = u.copied; }, fail);
    } catch (e) { fail(); }
  });

  $('foot').innerHTML = `${esc(c.name)} · <a href="#intro">${u.top}</a>`;
  markCurrent();
}

/* القسم الظاهر يُعلَّم في القائمة */
let visible = '';
function markCurrent() {
  document.querySelectorAll('.nav-list a').forEach(a => {
    if (a.getAttribute('href') === '#' + visible) a.setAttribute('aria-current', 'true');
    else a.removeAttribute('aria-current');
  });
}
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) visible = e.target.id; });
    markCurrent();
  }, { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('main section').forEach(s => io.observe(s));
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('site-top').classList.contains('open')) { setMenu(false); $('menu-btn').focus(); }
});

/* اللغة: من الرابط ?lang=en أو اختيار الزائر، ثم لغة متصفحه */
let start = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
try {
  const saved = localStorage.getItem('lang');
  if (saved === 'ar' || saved === 'en') start = saved;
  const asked = new URLSearchParams(location.search).get('lang');
  if (asked === 'ar' || asked === 'en') start = asked;
} catch (e) {}
render(start);
