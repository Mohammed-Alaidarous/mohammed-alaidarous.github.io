<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سعراتي</title>
<meta name="description" content="حاسبة شخصية للسعرات والماكروز">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1519" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سعراتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1 class="sr-only">سعراتي</h1>
  <div class="wrap bar">
    <nav class="daynav" id="daynav" aria-label="التاريخ">
      <button type="button" class="icon-btn" data-act="day-prev" aria-label="اليوم السابق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <div class="day-label">
        <b id="day-main">اليوم</b>
        <small id="day-sub"></small>
        <input type="date" id="day-input" aria-label="اختر التاريخ">
      </div>
      <button type="button" class="icon-btn" data-act="day-next" aria-label="اليوم التالي">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
    </nav>
    <h2 class="view-title" id="hdr-title" hidden></h2>
  </div>
</header>

<main class="wrap" id="main">
  <div class="view" id="view-today"></div>
  <div class="view" id="view-foods" hidden></div>
  <div class="view" id="view-progress" hidden></div>
  <div class="view" id="view-profile" hidden></div>
</main>

<nav class="tabs" aria-label="الأقسام">
  <div class="tabs-in">
    <button type="button" class="tab" data-act="tab" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/><path d="M12 8v4l2.5 2"/></svg>
      <span>اليوم</span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="foods">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8.5 7.5c0-1.4 1-1.9 1-3.3M12 7.5c0-1.4 1-1.9 1-3.3M15.5 7.5c0-1.4 1-1.9 1-3.3"/></svg>
      <span>الأطعمة</span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="m5 15 4-4 3 3 6.5-6.5"/><path d="M14.5 7.5h4v4"/></svg>
      <span>التقدم</span>
    </button>
    <button type="button" class="tab" data-act="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.75"/><path d="M4.75 20c.9-3.9 3.8-6 7.25-6s6.35 2.1 7.25 6"/></svg>
      <span>حسابي</span>
    </button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-head">
    <button type="button" class="icon-btn" data-act="sheet-back" id="sheet-back" aria-label="رجوع" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <h2 id="sheet-title"></h2>
    <button type="button" class="icon-btn" data-act="sheet-close" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
